<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — каталог моделей</title>
<!-- Стили инлайном: страница входа не должна зависеть от /static, который
     закрыт авторизацией, иначе форма показывалась бы без оформления. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2740 0%, #0e1117 60%);
    color: #e6e9ef; padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; background: #161b25; padding: 32px;
    border: 1px solid #262d3a; border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 24px; color: #8b95a7; font-size: 13px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; color: #b6bfcf; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 16px; font-size: 15px;
    background: #0e131b; color: #e6e9ef;
    border: 1px solid #2b3342; border-radius: 8px;
  }
  input:focus { outline: none; border-color: #4b7bec; box-shadow: 0 0 0 3px rgba(75,123,236,.2); }
  button {
    width: 100%; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: #4b7bec; color: #fff; border: 0; border-radius: 8px;
  }
  button:hover { background: #3d6ad9; }
  .error {
    margin-bottom: 16px; padding: 10px 12px; font-size: 13px;
    background: rgba(229,79,79,.12); border: 1px solid rgba(229,79,79,.35);
    border-radius: 8px; color: #ff9b9b;
  }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Каталог 3D-моделей</h1>
    <p class="sub">Доступ только для авторизованных пользователей</p>
    <!--ERROR-->
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="__NEXT__">
    <button type="submit">Войти</button>
  </form>
</body>
</html>
