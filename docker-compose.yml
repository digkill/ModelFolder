services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-model_catalog}
      POSTGRES_USER: ${DB_USERNAME:-model_catalog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-model_catalog}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      # host:container — наружу нестандартные порты, чтобы не конфликтовать
      # с другими Qdrant/сервисами на машине. Внутри compose используется 6333.
      - "${QDRANT_HOST_PORT:-16333}:6333"   # REST + дашборд на /dashboard
      - "${QDRANT_GRPC_HOST_PORT:-16334}:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    mem_limit: 7g
    mem_reservation: 1g
    cpus: "6.0"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-18080}:8000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DATA_DIR: /data/app
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:18080}
      PREVIEW_MAX_MEMORY_MB: ${PREVIEW_MAX_MEMORY_MB:-6144}
      RUN_SCANNER: ${RUN_SCANNER:-1}
      STUDIO_WEB_URL: http://studio-web:80
      STUDIO_API_URL: http://studio-api:8080
    volumes:
      - app_data:/data/app

  # Воркер обогащения БД: авто-теги (Vision) + AI-описания + эмбеддинги в Qdrant.
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    mem_limit: 7g
    mem_reservation: 512m
    cpus: "3.5"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DB_CONNECTION: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DATA_DIR: /data/app
    volumes:
      - app_data:/data/app

  studio-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD:-studio}
    ports:
      - "${STUDIO_DB_PORT:-15433}:5432"
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  studio-api:
    build: ./studio/backend
    restart: unless-stopped
    env_file:
      - path: ./studio/.env
        required: false
    environment:
      STUDIO_ADDR: :8080
      STUDIO_DATABASE_URL: postgres://studio:${STUDIO_DB_PASSWORD:-studio}@studio-db:5432/studio?sslmode=disable
      CATALOG_URL: http://app:8000
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      STUDIO_ORCHESTRATOR: ${STUDIO_ORCHESTRATOR:-auto}
    ports:
      - "${STUDIO_API_PORT:-18082}:8080"
    depends_on:
      studio-db:
        condition: service_healthy
      app:
        condition: service_started

  studio-web:
    build: ./studio/web
    restart: unless-stopped
    ports:
      - "${STUDIO_WEB_PORT:-18081}:80"
    depends_on:
      - studio-api

volumes:
  postgres_data:
  qdrant_storage:
  app_data:
  studio_pg:
