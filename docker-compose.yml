services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      # host:container — наружу нестандартные порты, чтобы не конфликтовать
      # с другими Qdrant/сервисами на машине. Внутри compose используется 6333.
      - "${QDRANT_HOST_PORT:-16333}:6333"   # REST + дашборд на /dashboard
      - "${QDRANT_GRPC_HOST_PORT:-16334}:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5

